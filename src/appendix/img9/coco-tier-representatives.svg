<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">8T and 20T representative tier comparison</title>
  <desc id="desc">Model execution FPS for three representative detectors under two precision modes and two compute tiers.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="56" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">8T versus 20T representative comparison</text>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="14" fill="#5d6878">Model execution FPS from p50 latency; representative smoke only</text>
  <line x1="230" y1="100" x2="930" y2="100" stroke="#d8dee8"/>
  <line x1="230" y1="100" x2="230" y2="470" stroke="#bfc8d6"/>
  <line x1="230" y1="470" x2="930" y2="470" stroke="#bfc8d6"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#657184"><text x="226" y="490">0</text><text x="401" y="490">20</text><text x="576" y="490">40</text><text x="751" y="490">60</text><text x="916" y="490">80 FPS</text></g>
  <g stroke="#edf0f4" stroke-width="1"><line x1="405" y1="100" x2="405" y2="470"/><line x1="580" y1="100" x2="580" y2="470"/><line x1="755" y1="100" x2="755" y2="470"/><line x1="930" y1="100" x2="930" y2="470"/></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#263449"><text x="56" y="145">SSDLite320</text><text x="56" y="255">NanoDet-Plus-M</text><text x="56" y="365">YOLOv5n</text></g>
  <g fill="#3b6fb6"><rect x="230" y="116" width="457" height="12" rx="3"/><rect x="230" y="226" width="517" height="12" rx="3"/><rect x="230" y="336" width="262" height="12" rx="3"/></g>
  <g fill="#e3a33a"><rect x="230" y="132" width="523" height="12" rx="3"/><rect x="230" y="242" width="476" height="12" rx="3"/><rect x="230" y="352" width="464" height="12" rx="3"/></g>
  <g fill="#73a7d8"><rect x="230" y="148" width="452" height="12" rx="3"/><rect x="230" y="258" width="483" height="12" rx="3"/><rect x="230" y="368" width="174" height="12" rx="3"/></g>
  <g fill="#d49a42"><rect x="230" y="164" width="593" height="12" rx="3"/><rect x="230" y="274" width="488" height="12" rx="3"/><rect x="230" y="384" width="333" height="12" rx="3"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#4d596b"><text x="692" y="126">20T FP32 52.27</text><text x="758" y="142">20T mix 59.80</text><text x="687" y="158">8T FP32 51.67</text><text x="828" y="174">8T mix 67.73</text><text x="752" y="236">20T FP32 59.13</text><text x="711" y="252">20T mix 54.34</text><text x="718" y="268">8T FP32 55.19</text><text x="723" y="284">8T mix 55.74</text><text x="497" y="346">20T FP32 29.95</text><text x="699" y="362">20T mix 53.03</text><text x="410" y="378">8T FP32 19.89</text><text x="568" y="394">8T mix 38.07</text></g>
  <rect x="56" y="520" width="14" height="14" rx="3" fill="#3b6fb6"/><text x="78" y="532" font-family="Arial, sans-serif" font-size="13" fill="#4d596b">20T FP32</text><rect x="170" y="520" width="14" height="14" rx="3" fill="#e3a33a"/><text x="192" y="532" font-family="Arial, sans-serif" font-size="13" fill="#4d596b">20T mixed FP16</text><rect x="360" y="520" width="14" height="14" rx="3" fill="#73a7d8"/><text x="382" y="532" font-family="Arial, sans-serif" font-size="13" fill="#4d596b">8T FP32</text><rect x="480" y="520" width="14" height="14" rx="3" fill="#d49a42"/><text x="502" y="532" font-family="Arial, sans-serif" font-size="13" fill="#4d596b">8T mixed FP16</text>
</svg>
