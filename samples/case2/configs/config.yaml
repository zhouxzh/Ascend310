model:
  detection_model: "models/detection/yolov8s.om"
  tracking_model: "models/tracking/deepsort.yaml"

tracking:
  iou_threshold: 0.5
  confidence_threshold: 0.3
  max_age: 30
  min_hits: 3

video:
  source: 0 # 0 for webcam, or path to video file
  output_dir: "output"
  save_video: False

display:
  show_fps: True
  show_tracks: True