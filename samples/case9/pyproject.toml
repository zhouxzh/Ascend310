[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-edge-chat"
version = "0.1.0"
description = "Ascend 310B text chat service with a MindSpore backend"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<0.129",
  "httpx>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
  "python-dotenv>=1.0,<1.2.2",
  "uvicorn[standard]>=0.30,<0.40",
]

[project.optional-dependencies]
voice = [
  "sherpa-onnx==1.13.6",
]

[project.scripts]
ascend-edge-chat = "ascend_edge_chat.cli:main"

[tool.setuptools.packages.find]
include = ["ascend_edge_chat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
