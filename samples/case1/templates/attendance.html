<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .camera-box { width: 100%; max-width: 640px; margin: 0 auto; background: #000; min-height: 480px; position: relative; overflow: hidden; border-radius: 8px;}
        video, img.video-stream { width: 100%; height: auto; display: block; }
        canvas { display: none; }
        .status-badge { position: absolute; top: 10px; right: 10px; }
        
        /* Success Animation Overlay */
        .checkin-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(40, 167, 69, 0.3);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }
        
        .checkin-icon {
            font-size: 5rem;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .checkin-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="/users_page" class="nav-link">User Management</a></li>
                <li class="nav-item"><a href="/attendance_page" class="nav-link active">Attendance Log</a></li>
            </ul>
        </header>

        <div class="row">
            <div class="col-md-6">
                <!-- Local Camera (Backend) -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Device Camera (Auto Check-in)</span>
                        <span class="badge bg-danger">Live</span>
                    </div>
                    <div class="card-body p-0 text-center bg-black position-relative camera-box">
                        <img src="/video_feed" class="video-stream" alt="Camera Stream" onerror="this.style.display='none'; document.getElementById('cam-error').style.display='block'">
                        <div id="cam-error" class="text-white p-5" style="display:none;">
                            <p>Camera stream not available.</p>
                            <small>Check if camera is connected to the server.</small>
                        </div>
                        
                        <!-- Overlay for Device Camera -->
                        <div id="device-overlay" class="checkin-overlay">
                            <div class="checkin-icon">✅</div>
                            <div class="checkin-text" id="device-checkin-name">User Name</div>
                        </div>
                    </div>
                </div>

                <!-- Web Camera (Frontend) -->
                <div class="card mb-4">
                    <div class="card-header">Web Browser Camera (Manual)</div>
                    <div class="card-body text-center">
                        <div class="camera-box" style="min-height: auto;">
                            <video id="video" autoplay playsinline></video>
                            <canvas id="canvas"></canvas>
                            <!-- Overlay for Web Camera -->
                            <div id="web-overlay" class="checkin-overlay">
                                <div class="checkin-icon">✅</div>
                                <div class="checkin-text" id="web-checkin-name">User Name</div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button id="captureBtn" class="btn btn-primary">Manual Check-in</button>
                        </div>
                        <div id="checkinResult" class="mt-2 fw-bold"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">Upload Check-in</div>
                    <div class="card-body">
                         <input type="file" class="form-control mb-2" id="uploadImage" accept="image/*">
                         <button class="btn btn-secondary w-100" onclick="uploadCheckin()">Upload & Check-in</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Attendance Log</h3>
                <button class="btn btn-sm btn-outline-primary mb-2" onclick="loadAttendance()">Refresh</button>
                <div style="height: 600px; overflow-y: auto;">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>User</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Web Camera Logic ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const checkinResult = document.getElementById('checkinResult');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => {
                console.error("Web Camera error:", err);
                // checkinResult.innerText = "Web camera access denied or unavailable.";
            });

        function captureAndSend() {
            if (!video.srcObject) {
                alert("Web camera not available");
                return;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataURL = canvas.toDataURL('image/jpeg');
            
            sendCheckin(dataURL, 'camera');
        }

        function sendCheckin(dataURL, type) {
            const formData = new FormData();
            formData.append('image_base64', dataURL);

            fetch('/api/clockin', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.match) {
                        checkinResult.className = 'text-success';
                        checkinResult.innerText = `Checked in: ${data.user} (${(data.similarity).toFixed(2)})`;
                        showAnimation('web-overlay', data.user);
                        loadAttendance();
                    } else {
                        checkinResult.className = 'text-warning';
                        checkinResult.innerText = `No match found (${(data.similarity).toFixed(2)})`;
                    }
                } else {
                    checkinResult.className = 'text-danger';
                    checkinResult.innerText = data.error || 'Error';
                }
                setTimeout(() => { checkinResult.innerText = ''; }, 3000);
            });
        }

        document.getElementById('captureBtn').addEventListener('click', captureAndSend);

        // Upload Checkin
        function uploadCheckin() {
            const fileInput = document.getElementById('uploadImage');
            if(fileInput.files.length === 0) return;
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            
            fetch('/api/clockin', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.match) {
                    alert(`Checked in: ${data.user}`);
                    loadAttendance();
                } else {
                    alert('Check-in failed or no match.');
                }
            });
        }

        // Load Attendance
        function loadAttendance() {
            fetch('/api/attendance')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('attendanceTableBody');
                    tbody.innerHTML = '';
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.timestamp}</td>
                            <td>${row.name || 'Unknown'}</td>
                            <td>${row.type}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }
        
        // Auto refresh attendance log every 5 seconds (to show device camera check-ins)
        let lastAttendanceCount = 0;
        
        function loadAttendance() {
            fetch('/api/attendance')
                .then(response => response.json())
                .then(data => {
                    // Check for new records (auto-checkin detection)
                    if (data.length > lastAttendanceCount && lastAttendanceCount !== 0) {
                        const newRecord = data[0]; // Assuming sorted DESC
                        if (newRecord && newRecord.type === 'camera_auto') {
                             showAnimation('device-overlay', newRecord.name);
                        }
                    }
                    lastAttendanceCount = data.length;
                
                    const tbody = document.getElementById('attendanceTableBody');
                    tbody.innerHTML = '';
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.timestamp}</td>
                            <td>${row.name || 'Unknown'}</td>
                            <td>${row.type}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }
        
        function showAnimation(overlayId, name) {
            const overlay = document.getElementById(overlayId);
            const text = overlay.querySelector('.checkin-text');
            text.innerText = "Welcome, " + name + "!";
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 2000);
        }
        
        setInterval(loadAttendance, 2000); // Faster refresh for animation

        loadAttendance();
    </script>
</body>
</html>
