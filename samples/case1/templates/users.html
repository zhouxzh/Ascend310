<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="/users_page" class="nav-link active">User Management</a></li>
                <li class="nav-item"><a href="/attendance_page" class="nav-link">Attendance Log</a></li>
            </ul>
        </header>

        <div class="row">
            <div class="col-md-4">
                <h3>Add User</h3>
                <ul class="nav nav-tabs mb-3" id="registerTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload" type="button" role="tab">Upload Photo</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="camera-tab" data-bs-toggle="tab" data-bs-target="#camera" type="button" role="tab">Device Camera</button>
                    </li>
                </ul>

                <div class="tab-content" id="registerTabContent">
                    <!-- Upload Tab -->
                    <div class="tab-pane fade show active" id="upload" role="tabpanel">
                        <form id="addUserForm">
                            <div class="mb-3">
                                <label for="userName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="userName" required>
                            </div>
                            <div class="mb-3">
                                <label for="userImage" class="form-label">Face Image</label>
                                <input type="file" class="form-control" id="userImage" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-success">Add User</button>
                        </form>
                    </div>
                    
                    <!-- Camera Tab -->
                    <div class="tab-pane fade" id="camera" role="tabpanel">
                         <form id="addCamUserForm">
                            <div class="mb-3">
                                <label for="camUserName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="camUserName" required>
                            </div>
                            <div class="mb-3 text-center bg-black" style="min-height: 240px;">
                                <img src="/video_feed" class="img-fluid" id="livePreview" style="max-height: 240px;">
                                <img src="" class="img-fluid" id="capturedPreview" style="display:none; max-height: 240px;">
                            </div>
                            <div class="mb-3 d-grid gap-2">
                                <button type="button" class="btn btn-primary" id="btnCapture" onclick="captureFrame()">Capture Frame</button>
                                <button type="button" class="btn btn-secondary" id="btnRetake" onclick="retakeFrame()" style="display:none;">Retake</button>
                            </div>
                            <input type="hidden" id="tempPath" name="temp_path">
                            <button type="submit" class="btn btn-success" id="btnRegisterCam" disabled>Add User</button>
                        </form>
                    </div>
                </div>
                
                <div id="addResult" class="mt-3"></div>
            </div>
            <div class="col-md-8">
                <h3>Registered Users</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Registered At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load Users
        function loadUsers() {
            fetch('/api/users?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = '';
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center">No users found</td></tr>';
                        return;
                    }
                    data.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.created_at}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error(err));
        }

        // Add User (Upload)
        document.getElementById('addUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('userName').value);
            formData.append('image', document.getElementById('userImage').files[0]);

            registerUser(formData, 'addUserForm');
        });

        // Add User (Camera)
        document.getElementById('addCamUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('camUserName').value);
            formData.append('temp_path', document.getElementById('tempPath').value);
            
            registerUser(formData, 'addCamUserForm');
        });

        function registerUser(formData, formId) {
             fetch('/api/users', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('User added successfully!');
                    loadUsers();
                    document.getElementById(formId).reset();
                    if(formId === 'addCamUserForm') retakeFrame();
                } else {
                    alert('Error: ' + data.error);
                }
            });
        }

        // Camera Logic
        function captureFrame() {
            fetch('/api/camera/capture', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('tempPath').value = data.temp_path;
                    document.getElementById('livePreview').style.display = 'none';
                    const cap = document.getElementById('capturedPreview');
                    cap.src = '/video_feed'; // Trick to refresh? No, need static serve or base64. 
                    // Actually /video_feed is stream. 
                    // We should serve the temp file or just stop updating live preview?
                    // Better: The API didn't return image url.
                    // Let's assume we can serve it via a static route or just trust it captured.
                    // Or simpler: Pause the live view? No.
                    
                    // Let's serve the temp file?
                    // app.py config['UPLOAD_FOLDER'] is 'uploads'
                    // We need a route to serve uploads? Or simpler: use data url if API returned it.
                    // But API returned path.
                    
                    // For now, let's just hide live preview and show a "Captured" placeholder or nothing.
                    // Or better, change the livePreview src to static image?
                    // We haven't exposed uploads folder.
                    
                    // Quick fix: Just hide live and show "Captured".
                    document.getElementById('livePreview').style.display = 'none';
                    document.getElementById('capturedPreview').style.display = 'block';
                    document.getElementById('capturedPreview').src = "/uploads/" + data.temp_path; 
                    
                    document.getElementById('btnCapture').style.display = 'none';
                    document.getElementById('btnRetake').style.display = 'inline-block';
                    document.getElementById('btnRegisterCam').disabled = false;
                } else {
                    alert("Capture failed: " + data.error);
                }
            });
        }

        function retakeFrame() {
            document.getElementById('livePreview').style.display = 'block';
            document.getElementById('capturedPreview').style.display = 'none';
            document.getElementById('btnCapture').style.display = 'inline-block';
            document.getElementById('btnRetake').style.display = 'none';
            document.getElementById('btnRegisterCam').disabled = true;
            document.getElementById('tempPath').value = '';
        }

        // Delete User
        function deleteUser(id) {
            if(confirm('Are you sure?')) {
                fetch(`/api/users/${id}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) loadUsers();
                });
            }
        }

        loadUsers();
    </script>
</body>
</html>
